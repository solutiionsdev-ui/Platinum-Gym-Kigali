<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOLT CRM · Today on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F6F7F6}
a{color:#0F7A57;text-decoration:none}a:hover{color:#0A5A40}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px; background: #F6F7F6; color: #111412; font-family: Geist, system-ui, sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #E4E7E5">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: #111412; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"></path></svg>
      </span>
      <span style="font-weight: 700; letter-spacing: 0.04em">VOLT</span>
    </div>
    <div style="display: flex; gap: 6px; align-items: center">
      <button type="button" aria-label="Search members" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #111412; display: inline-flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
      <span style="width: 34px; height: 34px; border-radius: 999px; background: #E8ECE9; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">NR</span>
    </div>
  </header>

  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 600">Good afternoon, Nadim</h1>
      <div style="color: #5E6661; font-size: 15px">Tuesday 24 November · <span style="font-family: 'Geist Mono', monospace">16:40</span></div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4E7E5; border-radius: 14px; padding: 16px; font-size: 16px; line-height: 1.6">
      So far today: <strong>142 check-ins</strong>, <strong>$1,240 collected</strong>. 10 classes, 6 PT sessions. <strong>7 things need you.</strong>
    </div>

    <section aria-labelledby="pn-h" style="display: flex; flex-direction: column; gap: 10px">
      <h2 id="pn-h" style="margin: 0; font-size: 17px; font-weight: 600">Needs you <span style="font-family: 'Geist Mono', monospace; color: #5E6661; font-weight: 400">7</span></h2>
      <sc-for list="{{needs}}" as="x" hint-placeholder-count="5">
        <div style="background: #FFFFFF; border: 1px solid #E4E7E5; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; gap: 12px; align-items: flex-start">
            <span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: {{x.bg}}; color: {{x.fg}}; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.d}}"></path></svg>
            </span>
            <div style="flex: 1; min-width: 0">
              <div style="font-weight: 600">{{x.title}}</div>
              <div style="font-size: 14px; color: #5E6661">{{x.sub}}</div>
            </div>
          </div>
          <button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #E4E7E5; background: #FFFFFF; color: #111412; font: inherit; font-size: 15px; font-weight: 600">{{x.action}}</button>
        </div>
      </sc-for>
      <button type="button" style="min-height: 44px; border-radius: 10px; border: 0; background: transparent; color: #0F7A57; font: inherit; font-weight: 600">Show 2 more</button>
    </section>

    <section aria-labelledby="pc-h" style="background: #FFFFFF; border: 1px solid #E4E7E5; border-radius: 14px">
      <div style="padding: 14px 16px; border-bottom: 1px solid #EEF0EE; display: flex; justify-content: space-between; align-items: center">
        <h2 id="pc-h" style="margin: 0; font-size: 17px; font-weight: 600">Next classes</h2>
        <a href="#" style="font-size: 15px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center">Schedule</a>
      </div>
      <sc-for list="{{classes}}" as="c" hint-placeholder-count="5">
        <div style="padding: 12px 16px; border-bottom: 1px solid #EEF0EE; display: flex; gap: 12px; align-items: center">
          <span style="font-family: 'Geist Mono', monospace; width: 48px">{{c.time}}</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-weight: 500">{{c.name}} <span style="color: #5E6661; font-weight: 400">· {{c.coach}}</span></div>
            <div style="margin-top: 4px; height: 4px; border-radius: 2px; background: #EEF0EE; overflow: hidden"><div style="height: 4px; width: {{c.pct}}; background: {{c.bar}}"></div></div>
          </div>
          <span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: {{c.countFg}}">{{c.count}}</span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="CRM" style="position: sticky; bottom: 0; margin-top: auto; background: #FFFFFF; border-top: 1px solid #E4E7E5; display: flex; justify-content: space-around; align-items: center; padding: 6px 4px 18px">
    <a href="CRM-Today.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #111412; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Today
    </a>
    <a href="#" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5E6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Schedule
    </a>
    <a href="#" aria-label="Check in a member" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #111412; font-size: 12px; font-weight: 600">
      <span style="width: 44px; height: 32px; border-radius: 10px; background: #111412; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      </span>Check in
    </a>
    <a href="CRM-Member.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5E6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Members
    </a>
    <a href="#" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #5E6661; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>More
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F135","options":["#C8F135","#FF6B2C","#4D8BFF","#F5F5F2"]},"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C8F135';
    const SEV = { red: { fg: '#A12C22', bg: '#FBE4E1' }, amber: { fg: '#8A4B00', bg: '#FCEFD9' }, purple: { fg: '#5B3BA8', bg: '#EEE8FA' }, blue: { fg: '#1E4FB8', bg: '#E3EBFC' } };
    const need = (sev, d, title, sub, action) => ({ ...SEV[sev], d, title, sub, action });
    const cls = (time, name, coach, b, cap) => ({ time, name, coach, count: b >= cap ? 'Full' : b + '/' + cap, pct: Math.round(b / cap * 100) + '%', bar: b >= cap ? '#8A4B00' : '#111412', countFg: b >= cap ? '#8A4B00' : '#3D4540' });
    return {
      accent,
      needs: [
        need('red', 'M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6', '3 payments overdue · $355', 'Hadi Chamoun, Lynn Sfeir, Omar Itani', 'Send reminders'),
        need('amber', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2', "Hadi's membership ends Saturday", 'No renewal yet', 'Send renewal offer'),
        need('purple', 'M19 8v6M22 11h-6M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', '2 trial requests not contacted', 'From the website, 3 h and 5 h ago', 'Open leads'),
        need('amber', 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', '19:00 Spin full, 5 waiting', '20:15 Spin has 4 spots', 'Offer 20:15'),
        need('blue', 'M22 17 13.5 8.5l-5 5L2 7M16 17h6v-6', 'Sat 09:00 Pilates is 21% full', '3 of 14 booked', 'Promote it')
      ],
      classes: [
        cls('17:30', 'HIIT', 'Lea', 10, 16), cls('18:30', 'Strength', 'Joe', 9, 12), cls('19:00', 'Spin', 'Karim', 20, 20),
        cls('20:15', 'Spin', 'Karim', 16, 20), cls('20:30', 'Yoga', 'Maya', 9, 18)
      ]
    };
  }
}
</script>
</body>
</html>
